# alembic.ini — sqlalchemy.engine logger locked to WARN
# This prevents SQLAlchemy from emitting the connection URL
# at INFO level during migration runs.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Intentionally blank — set programmatically in db/migrations.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

# ↓ WARN prevents SQLAlchemy from logging connection strings at INFO/DEBUG
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class     = StreamHandler
args      = (sys.stderr,)
level     = NOTSET
formatter = generic

[formatter_generic]
format   = %(levelname)-5.5s %(name)s %(message)s
datefmt  = %H:%M:%S